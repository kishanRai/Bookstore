spring.application.name=Bookstore
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# API descriptions are derived from controllers/DTOs; errors are documented per operation.
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
bookstore.api.version=@project.version@

# Reject fractional book IDs/quantities before Jakarta Validation sees truncated values.
spring.jackson.deserialization.accept-float-as-int=false
# Structured JSON includes scoped Log4j2 context fields and request correlation.
logging.structured.format.console=ecs
# Suppress INFO by default; override LOGGING_LEVEL_ROOT when more detail is needed.
logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
bookstore.cors.allowed-origins=${BOOKSTORE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.jackson.mapper.allow-coercion-of-scalars=false
